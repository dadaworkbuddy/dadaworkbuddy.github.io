<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>某某食品厂 · 公网主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8f0e8 100%);
      color: #2c3e2c;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      max-width: 640px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 40px 36px;
    }
    .badge {
      display: inline-block;
      background: #2e7d32;
      color: #fff;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    .sub { color: #6b7d6b; font-size: 14px; margin-bottom: 24px; }
    p { font-size: 15px; margin-bottom: 14px; }
    .info {
      background: #f4f8f4;
      border-left: 4px solid #2e7d32;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 20px;
    }
    .info strong { color: #2e7d32; }
    footer { margin-top: 28px; font-size: 12px; color: #9aa89a; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">公网主页已上线</span>
    <h1>某某食品有限公司</h1>
    <div class="sub">欢迎访问我们的公网主页 · 本页由 GitHub Pages 托管</div>

    <p>这里是工厂/部门的简要介绍。你可以把这段文字替换成实际内容，例如：主营业务、核心产品、联系方式、厂区公告等。</p>
    <p>本页完全公开，任何人都可以通过浏览器访问这个网址查看到这里展示的信息。</p>

    <div class="info">
      <strong>提示：</strong>把这段内容改成你真正想展示的文字即可。图片、表格、链接都可以放进来，保存后公网页面会自动更新。
    </div>

    <footer>© 2026 某某食品有限公司 · Powered by GitHub Pages</footer>
  </div>
</body>
</html>
